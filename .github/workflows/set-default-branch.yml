name: Set default branch to Playerbot (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  set-default:
    runs-on: ubuntu-latest
    steps:
      - name: Set default branch to Playerbot
        env:
          TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Add repo secret PERSONAL_ACCESS_TOKEN with 'repo' scope and try again."
            exit 1
          fi
          repo="${{ github.repository }}"
          echo "Setting default branch to Playerbot for $repo"
          resp=$(curl -s -w "\n%{http_code}" -X PATCH -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/$repo -d '{"default_branch":"Playerbot"}')
          body=$(echo "$resp" | sed -n '1,$p' | sed '$d')
          code=$(echo "$resp" | tail -n1)
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Default branch set successfully."
            echo "$body"
          else
            echo "Failed to set default branch (HTTP $code). Response:"
            echo "$body"
            exit 1
          fi
        shell: bash
